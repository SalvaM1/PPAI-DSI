<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <title>Eventos Sísmicos</title>
</head>
<body>
<h1>Estación Sismológica</h1>
<hr>

<div class="container">
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>

    <h2 class="text-center mb-4">Eventos Sísmicos Pendientes de Revisión</h2>

    <div th:if="${#lists.isEmpty(eventos)}">
        <p class="text-center">No hay eventos pendientes para revisar.</p>
    </div>

    <div th:if="${!#lists.isEmpty(eventos)}" class="table-responsive">
        <table class="table table-bordered table-striped mx-auto" style="width:80%;">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha y Hora</th>
                <th>Epicentro (lat, long)</th>
                <th>Hipocentro (lat, long)</th>
                <th>Magnitud</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="evento : ${eventos}">
                <td th:text="${evento.id}"></td>
                <td th:text="${#temporals.format(evento.fechaHoraOcurrencia, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td>
                    <span th:text="${evento.latitudEpicentro}"></span>,
                    <span th:text="${evento.longitudEpicentro}"></span>
                </td>
                <td>
                    <span th:text="${evento.latitudHipocentro}"></span>,
                    <span th:text="${evento.longitudHipocentro}"></span>
                </td>
                <td>
                    <span th:text="${evento.valorMagnitud}"></span>
                    (<span th:text="${evento.clasificacion}"></span>)
                </td>
                <td class="text-center">
                    <form th:action="@{/eventos/revisar}" method="get">
                        <input type="hidden" name="id" th:value="${evento.id}">
                        <button type="submit" class="btn btn-primary btn-sm">Revisar Evento</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
