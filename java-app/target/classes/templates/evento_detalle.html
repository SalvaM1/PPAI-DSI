<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/detalle.css}" rel="stylesheet">
    <title>Detalle de Evento Sísmico</title>
</head>
<body class="p-4">

<h1 class="mb-3">Evento Sísmico Seleccionado</h1>
<hr>

<div class="mb-3" th:if="${usuario != null}">
    <strong>Analista encargado:</strong>
    <span th:text="${usuario.nombre}"></span>
</div>

<div class="alert alert-success alert-dismissible fade show mx-3 mb-4 position-relative" role="alert"
     th:if="${sismograma}">
    <strong th:text="'Sismograma generado: ' + ${sismograma}"></strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
</div>

<div class="mb-5">
    <h5 class="mb-3">Datos Sísmicos</h5>
    <div class="table-responsive">
        <table class="table table-bordered">
            <tr>
                <th>Alcance</th>
                <td th:text="${evento.alcance}"></td>
            </tr>
            <tr>
                <th>Clasificación</th>
                <td th:text="${evento.clasificacion}"></td>
            </tr>
            <tr>
                <th>Origen</th>
                <td th:text="${evento.origenGeneracion}"></td>
            </tr>
        </table>
    </div>
</div>

<div th:each="serie, serieStat : ${evento.seriesTemporales}">
    <h5 class="mt-4 mb-2">
        <span th:text="'Serie Temporal ' + ${serieStat.index + 1}"></span>
        –
        <span th:text="'Inicio: ' + ${#temporals.format(serie.fechaHoraInicioMuestras, 'yyyy-MM-dd HH:mm:ss')}"></span>
        –
        <span th:text="'Estación: ' + ${serie.estacion != null ? serie.estacion.nombre : 'sin asignar'}"></span>
    </h5>
    <div class="table-responsive mb-5">
        <table class="table table-sm table-striped align-middle">
            <thead>
            <tr>
                <th>Número de muestra</th>
                <th>Instante (s)</th>
                <th>Velocidad de onda (m/s)</th>
                <th>Frecuencia (Hz)</th>
                <th>Longitud de onda (m)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="muestra, muestraStat : ${serie.muestras}">
                <td th:text="${muestraStat.index + 1}"></td>
                <td th:text="${T(java.time.Duration).between(serie.fechaHoraInicioMuestras, muestra.fechaHoraMuestra).seconds}"></td>
                <td>
                    <span th:each="detalle : ${muestra.detalles}"
                          th:if="${detalle.tipoDeDato.denominacion == 'velocidad de onda'}"
                          th:text="${detalle.valor}"></span>
                </td>
                <td>
                    <span th:each="detalle : ${muestra.detalles}"
                          th:if="${detalle.tipoDeDato.denominacion == 'frecuencia'}"
                          th:text="${detalle.valor}"></span>
                </td>
                <td>
                    <span th:each="detalle : ${muestra.detalles}"
                          th:if="${detalle.tipoDeDato.denominacion == 'longitud'}"
                          th:text="${detalle.valor}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="d-flex justify-content-center my-4">
    <button type="button" class="map-btn">Mostrar Mapa</button>
    </div>

<hr>

<form id="form-rechazar" method="post" th:action="@{/eventos/rechazar}">
    <input type="hidden" name="id" id="evento-id" th:value="${evento.id}">

    <div class="row mb-5 gx-4 mx-3">
        <div class="col-md-4">
            <label>Alcance (km)</label>
            <input id="input-alcance" name="alcance" type="number" class="form-control"
                   th:value="${evento.alcance}" readonly>
        </div>
        <div class="col-md-4">
            <label>Magnitud</label>
            <input id="input-magnitud" name="magnitud" type="number" step="0.1" class="form-control"
                   th:value="${evento.magnitud}" readonly>
        </div>
        <div class="col-md-4">
            <label>Origen de Generación</label>
            <input id="input-origen" name="origen" type="text" class="form-control"
                   th:value="${evento.origenGeneracion}" readonly>
        </div>
    </div>
</form>

<div class="d-flex justify-content-center">
    <button type="button" class="map-btn">Modificar</button>
</div>

<hr>

<div class="mx-3 my-4 text-center">
    <p class="h5 mb-3">Seleccionar acción:</p>
    <div class="d-flex justify-content-center gap-3">
        <a class="btn btn-success btn-lg" th:href="@{/eventos}">Confirmar evento</a>
        <button type="button" id="btn-rechazar" class="btn btn-danger btn-lg">Rechazar evento</button>
        <button type="button" class="btn btn-warning btn-lg">Solicitar revisión a experto</button>
    </div>
</div>

<div id="rechazar-msg" class="text-center mt-3"></div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const rechazarUrl = /*[[@{/eventos/rechazar}]]*/ '';
        const btnRechazar = document.getElementById('btn-rechazar');
        if (!btnRechazar) {
            return;
        }
        btnRechazar.addEventListener('click', async (event) => {
            event.preventDefault();
            const id = document.getElementById('evento-id').value;
            const alcance = document.getElementById('input-alcance').value;
            const magnitud = document.getElementById('input-magnitud').value;
            const origen = document.getElementById('input-origen').value.trim();
            const msgBox = document.getElementById('rechazar-msg');

            if (!alcance || !magnitud || !origen) {
                msgBox.innerHTML = '<div class="alert alert-danger">Faltan datos de alcance, magnitud u origen.</div>';
                return;
            }

            const formData = new FormData();
            formData.append('id', id);
            formData.append('alcance', alcance);
            formData.append('magnitud', magnitud);
            formData.append('origen', origen);

            try {
                const response = await fetch(rechazarUrl, {
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    msgBox.innerHTML = '<div class="alert alert-success">Evento rechazado correctamente.</div>';
                } else {
                    const errorText = await response.text();
                    msgBox.innerHTML = `<div class="alert alert-danger">Error: ${errorText}</div>`;
                }
            } catch (err) {
                console.error(err);
                msgBox.innerHTML = '<div class="alert alert-danger">Error de red al rechazar el evento.</div>';
            }
        });
    });
</script>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
